<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1838">
<title>節奏樂園</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1d1838; --panel: #2b2453; --panel-line: #4a3f80; --text: #f6f1ff; --muted: #b9afd9;
    --low: #f2914a; --high: #39c6d6; --gold: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 2px solid var(--panel-line);
    border-radius: 14px; padding: 12px 18px; cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); border-color: var(--gold); color: #33240a; font-weight: 700; font-size: 22px; padding: 14px 44px; }
  .overlay {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; justify-content: safe center; overflow-y: auto; touch-action: pan-y;
    gap: 14px; padding: 16px; background: rgba(20, 15, 42, .82); text-align: center;
  }
  .overlay.show { display: flex; }
  h1 { margin: 0; font-size: clamp(34px, 6vh, 52px); color: var(--gold); }
  h2 { margin: 0; font-size: 30px; }
  p { margin: 0; color: var(--muted); }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .difficulty { width: clamp(96px, 28vw, 170px); padding-inline: 8px; display: flex; flex-direction: column; gap: 2px; }
  .difficulty strong { font-size: 22px; }
  .difficulty small { color: var(--muted); }
  .difficulty.selected, .song-card.selected { background: #4a3f80; border-color: var(--gold); }
  .song-card { width: clamp(96px, 28vw, 170px); padding: 8px; font-weight: 700; }
  #resultCombo { font-size: 20px; font-weight: 700; color: var(--gold); }
  .song-note { font-size: 15px; }
  #offsetValue { min-width: 92px; display: inline-block; font-variant-numeric: tabular-nums; }
  .small-button { padding: 8px 14px; }
  #pauseButton { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: none; width: 52px; height: 48px; padding: 0; background: rgba(43, 36, 83, .85); font-size: 18px; }
  #pauseButton.show { display: block; }
  #countdown { font-size: 90px; font-weight: 700; color: var(--gold); }
  .grade { font-size: 96px; line-height: 1; font-weight: 700; color: var(--gold); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(64px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border-radius: 12px; padding: 8px 12px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 14px; color: var(--muted); }
  #calibrateBeat { font-size: 64px; font-weight: 700; color: var(--gold); min-height: 80px; }
  @media (max-height: 480px) {
    .overlay { gap: 6px; padding-block: 8px; }
    h1 { font-size: 26px; }
    h2 { font-size: 20px; }
    button { padding: 6px 12px; }
    button.primary { font-size: 18px; padding: 8px 28px; }
    .song-card { padding: 4px 6px; font-size: 14px; }
    #resultCombo { font-size: 15px; }
    .difficulty strong { font-size: 17px; }
    .difficulty small { font-size: 12px; }
    .small-button { padding: 4px 10px; }
    .song-note { font-size: 13px; }
    .grade { font-size: 44px; }
    .stat { padding: 2px 8px; }
    .stat b { font-size: 18px; }
    .stat span { font-size: 12px; }
    #countdown { font-size: 60px; }
    #calibrateBeat { font-size: 40px; min-height: 48px; }
  }
</style>
<canvas id="game" aria-label="節奏遊戲畫面"></canvas>
<button id="pauseButton" aria-label="暫停">II</button>

<section id="menu" class="overlay show">
  <h1>節奏樂園</h1>
  <div class="row" id="songs"></div>
  <p id="songInfo" class="song-note"></p>
  <div class="row" id="difficulties"></div>
  <button id="startButton" class="primary">開始演奏</button>
  <p class="song-note" id="howToPlay"></p>
  <p class="song-note" id="deviceHint" hidden>轉成橫向玩會更順手</p>
  <div class="row song-note">
    <span>時間校正</span>
    <button id="offsetDown" class="small-button" aria-label="校正值減 5 毫秒">−5</button>
    <span id="offsetValue">0 毫秒</span>
    <button id="offsetUp" class="small-button" aria-label="校正值加 5 毫秒">+5</button>
    <button id="calibrateButton" class="small-button">自動校正</button>
  </div>
</section>

<section id="pause" class="overlay">
  <h2>暫停中</h2>
  <div class="row">
    <button id="resumeButton" class="primary">繼續</button>
    <button id="pauseRetry">重新開始</button>
    <button id="pauseMenu">回到選單</button>
  </div>
</section>

<section id="countdownOverlay" class="overlay"><div id="countdown">3</div></section>

<section id="result" class="overlay">
  <p id="resultTitle"></p>
  <div class="grade" id="resultGrade"></div>
  <h2 id="resultScore"></h2>
  <p id="resultCombo"></p>
  <p id="resultBadge"></p>
  <div class="stats">
    <div class="stat"><b id="statPerfect"></b><span>完美</span></div>
    <div class="stat"><b id="statGreat"></b><span>很好</span></div>
    <div class="stat"><b id="statGood"></b><span>可以</span></div>
    <div class="stat"><b id="statMiss"></b><span>漏接</span></div>
  </div>
  <p id="resultDetail" class="song-note"></p>
  <div class="row">
    <button id="retryButton" class="primary">再玩一次</button>
    <button id="menuButton">回到選單</button>
  </div>
</section>

<section id="calibrate" class="overlay">
  <h2>自動校正</h2>
  <p id="calibrateHint">先聽 4 下，再跟著節拍敲 12 下（任意位置或 F、J 鍵）</p>
  <div id="calibrateBeat"></div>
  <button id="calibrateCancel">取消</button>
</section>

<script src="js/core.js"></script>
<script src="js/songs.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
